# Fast full-catalog benchmark for iteration.
dataset_name: microlens_100k_full_catalog_50
loader: microlens

interaction_path: data/raw/microlens/MicroLens-100k/MicroLens-100k_pairs.csv
item_feature_paths:
  visual: data/raw/microlens/MicroLens-100k/extracted_modality_features/MicroLens-100k_image_features_CLIPRN50.npy
  text: data/raw/microlens/MicroLens-100k/extracted_modality_features/MicroLens-100k_title_en_text_features_BgeM3.npy
  audio: data/raw/microlens/MicroLens-100k/extracted_modality_features/MicroLens-100k_video_features_VideoMAE.npy
derived_feature_dir: data/raw/microlens/MicroLens-100k/derived_modality_features
title_path: data/raw/microlens/MicroLens-100k/MicroLens-100k_title_en.csv
tags_path: data/raw/microlens/MicroLens-100k/tags_to_summary.csv
comments_path: data/raw/microlens/MicroLens-100k/MicroLens-100k_comment_en.txt
engagement_path: data/raw/microlens/MicroLens-100k/MicroLens-100k_likes_and_views.txt

timestamp_column: timestamp
user_column: user
item_column: item
popularity_column: interaction_count

feature_dim: 64
max_comments_per_item: 5
evaluation_fraction: 0.2
negatives_per_user: 0
min_user_train_interactions: 3
max_eval_users: 50
