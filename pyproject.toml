[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-aware-recommendation-cold-start"
version = "0.1.0"
description = "Trend-aware cold-start recommendation scaffold for multimodal short-video ranking"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Owen Strength" },
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
